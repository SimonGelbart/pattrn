name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and consume packages
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', 'Pattrn.sln', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore Pattrn.sln

      - name: Build Release
        run: dotnet build Pattrn.sln --configuration Release --no-restore

      - name: Test benchmark tools
        run: python -m unittest discover tools/benchmarks/tests

      - name: Test supported projects
        run: >-
          dotnet test
          --test-modules "tests/**/bin/Release/net10.0/*.Tests.dll"
          --root-directory .
          --results-directory TestResults
          --
          --report-trx

      - name: Pack supported packages
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/pattrn-packages"
          mkdir -p "$package_dir"
          for project in \
            src/Pattrn/Pattrn.csproj \
            src/Pattrn.Strings/Pattrn.Strings.csproj \
            src/Pattrn.DependencyInjection/Pattrn.DependencyInjection.csproj; do
            dotnet pack "$project" --configuration Release --no-build --no-restore --output "$package_dir"
          done
          find "$package_dir" -maxdepth 1 -type f -name '*.nupkg' -print

      - name: Restore and build a clean package consumer
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/pattrn-package-consumer"
          package_dir="$RUNNER_TEMP/pattrn-packages"
          dotnet new console --framework net10.0 --output "$consumer_dir" --no-restore
          cat > "$consumer_dir/Consumer.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Pattrn" Version="0.1.0-alpha.1" />
              <PackageReference Include="Pattrn.Strings" Version="0.1.0-alpha.1" />
              <PackageReference Include="Pattrn.DependencyInjection" Version="0.1.0-alpha.1" />
            </ItemGroup>
          </Project>
          XML
          cat > "$consumer_dir/Program.cs" <<'CS'
          using Pattrn.Matching;
          using Pattrn.Patterns;

          var index = PattrnIndex<string, string>.Builder()
              .AddPattern([PatternSegment<string>.Literal("health")], "ok")
              .Build();
          Console.WriteLine(index.MatchValuesToArray(["health"])[0]);
          CS
          dotnet restore "$consumer_dir/Consumer.csproj" \
            --source "$package_dir" \
            --source https://api.nuget.org/v3/index.json
          dotnet build "$consumer_dir/Consumer.csproj" --configuration Release --no-restore

      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: |
            TestResults/*.trx
            TestResults/**/*.trx
          if-no-files-found: ignore
