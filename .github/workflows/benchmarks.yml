name: Focused benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter for a supported core scenario'
        required: false
        default: '*PattrnIndexBenchmarks*'
      job:
        description: 'BenchmarkDotNet job preset'
        required: false
        default: Dry
        type: choice
        options:
          - Dry
          - Short

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Run focused core benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      BENCHMARK_FILTER: ${{ github.event.inputs.filter || '*PattrnIndexBenchmarks*' }}
      BENCHMARK_JOB: ${{ github.event.inputs.job || 'Dry' }}
      BENCHMARK_ARTIFACTS: ${{ github.workspace }}/BenchmarkDotNet.Artifacts
      BENCHMARK_SUMMARY: ${{ github.workspace }}/benchmark-summary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore benchmark project
        run: dotnet restore benchmarks/Pattrn.Benchmarks/Pattrn.Benchmarks.csproj

      - name: Run focused benchmarks
        run: >-
          dotnet run
          --project benchmarks/Pattrn.Benchmarks/Pattrn.Benchmarks.csproj
          --configuration Release
          --no-restore
          --
          --filter "$BENCHMARK_FILTER"
          --job "$BENCHMARK_JOB"
          --exporters JSON GitHub
          --artifacts "$BENCHMARK_ARTIFACTS"

      - name: Generate optional grouped summary
        if: always()
        run: |
          set -euo pipefail
          if find "$BENCHMARK_ARTIFACTS/results" -maxdepth 1 -name '*-report-full-compressed.json' -print -quit | grep -q .; then
            python tools/benchmarks/summarize_benchmarks.py \
              --artifacts "$BENCHMARK_ARTIFACTS" \
              --output "$BENCHMARK_SUMMARY"
            cat "$BENCHMARK_SUMMARY/summaries/grouped-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No full compressed report was produced by this focused run; raw artifacts remain available.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            BenchmarkDotNet.Artifacts/**
            benchmark-summary/**
          if-no-files-found: warn
